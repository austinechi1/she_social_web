<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>S.H.E. Social Proposal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--lime:#EAF6A5;--lav:#9E94F5;--purple:#8E50BF;--cream:#F9F5F1;--white:#fff;--dark:#2A1550;--soft:#7A63A0}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:Jost,sans-serif}
    header{padding:34px 24px;background:linear-gradient(135deg,#2A1550,#6B38A0);color:#fff}
    .top{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .logo{width:145px;height:auto}.intro{text-align:right}.eyebrow{color:var(--lime);font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:6px 0 0;font:500 clamp(2rem,5vw,3.4rem)/1 'Cormorant Garamond',serif}h1 em{color:var(--lime)}
    main{max-width:1180px;margin:auto;padding:34px 24px 70px}.actions{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
    .actions p{margin:0;color:var(--soft);font-size:.95rem}.buttons{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-block;padding:14px 22px;background:var(--lime);color:var(--dark);text-decoration:none;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;border:1px solid var(--lime)}
    .btn.alt{background:transparent;border-color:var(--purple);color:var(--purple)}.btn:hover{filter:brightness(.96)}
    .viewer{height:calc(100vh - 245px);min-height:620px;background:#fff;border:1px solid rgba(142,80,191,.16);box-shadow:0 12px 40px rgba(42,21,80,.12)}
    iframe{width:100%;height:100%;border:0}footer{padding:28px 24px;text-align:center;background:var(--dark);color:rgba(255,255,255,.62);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:700px){header{padding:28px 20px}.top{display:block;text-align:center}.logo{margin:0 auto 18px}.intro{text-align:center}.actions{display:block;text-align:center}.buttons{justify-content:center;margin-top:16px}.viewer{height:70vh;min-height:480px}}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <a href="/"><img class="logo" src="/assets/images/nav-logo.png" alt="S.H.E. Social"></a>
      <div class="intro"><div class="eyebrow">Social media management</div><h1>Your S.H.E. Social <em>proposal</em></h1></div>
    </div>
  </header>
  <main>
    <div class="actions">
      <p>Review the proposal below or save a copy to your device.</p>
      <div class="buttons">
        <a class="btn alt" href="SHE-Social-Proposal.pdf" target="_blank" rel="noopener">Open Full Screen</a>
        <a class="btn" href="SHE-Social-Proposal.pdf" download>Download Proposal</a>
      </div>
    </div>
    <div class="viewer"><iframe src="SHE-Social-Proposal.pdf#view=FitH" title="S.H.E. Social proposal"></iframe></div>
  </main>
  <footer>© 2026 S.H.E. Social, LLC · Saint Cloud, Florida</footer>
</body>
</html>
